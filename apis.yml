name: Instil
description: 'Instil is a purpose-built fundraising CRM and revenue-intelligence platform
  for nonprofit organizations, built for major-gifts and development teams. It manages
  the full donor lifecycle across major gifts, capital campaigns, planned giving,
  grant tracking, and moves management, and layers AI on top with One-Click Briefings
  that assemble a constituent''s giving history and contact record on demand and Voice
  AI Logging that transcribes calls and writes interactions back to Instil or Salesforce.
  Instil connects to the nonprofit tech stack through Salesforce, Stripe, Classy,
  Mailchimp, Constant Contact, Eventbrite, Google, Outlook, and Zapier. It is backed
  by Threshold Ventures. No public developer API, documentation, or SDKs are published
  at this time; integrations are delivered through packaged connectors and Zapier.'
